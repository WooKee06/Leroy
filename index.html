<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link
      rel="preload"
      href="/src/app/styles/fonts/manrope-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/app/styles/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>leroy</title>
    <!-- Статичный splash: виден сразу, пока грузится JS-бандл. React заменит
         его при монтировании, так что белого экрана при старте нет. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0c0d12;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #ffffff;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .boot-logo {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: #f2f3f7;
        color: #0c0d12;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        font-size: 28px;
        font-weight: 800;
        line-height: 1;
      }
      html[data-theme='light'] .boot-logo {
        background: #1a1a1a;
        color: #ffffff;
      }
      .boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f2f3f7;
        animation: boot-spin 0.7s linear infinite;
      }
      html[data-theme='light'] .boot-spinner {
        border-color: rgba(0, 0, 0, 0.12);
        border-top-color: #1a1a1a;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <!-- defer: не блокируем первую отрисовку, скрипт всё равно выполнится
         раньше модулей приложения (они тоже отложенные). -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-logo">L</div>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
